<style>
:root{color-scheme:dark;--bg:#031110;--mint:#35e8c4;--mint2:#12b39a;--deep:#0b3c38;--ink:#e8fff9;--mute:#8dbab1;--glass:rgba(255,255,255,.055);--line:rgba(120,255,227,.18);

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,#07302d 0%,var(--bg) 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform;transition:translate .8s ease-out}
.b1{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:#0f8f7c;animation:d1 22s ease-in-out infinite alternate}
.b2{width:50vmax;height:50vmax;right:-22vmax;top:30vh;background:#0a5f58;animation:d2 28s ease-in-out infinite alternate}
.b3{width:34vmax;height:34vmax;left:10vmax;bottom:-16vmax;background:#1fd6b4;opacity:.22;animation:d3 25s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.1)}}
@keyframes d2{to{transform:translate(-7vmax,-8vmax) scale(.92)}}
@keyframes d3{to{transform:translate(9vmax,-5vmax) scale(1.15)}}
.grain{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}

.avatar{width:132px;height:132px;border-radius:50%;margin:0 auto 14px;padding:4px;background:conic-gradient(from 200deg,var(--mint),var(--deep),var(--mint2),var(--mint));box-shadow:0 0 38px rgba(53,232,196,.35)}
.avatar img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;border:3px solid var(--bg)}
h1{font-size:1.55rem;font-weight:500;margin:0;letter-spacing:.02em}
.tag{margin:6px 0 0;color:var(--mute);font-weight:300;min-height:1.4em}
.tt{display:inline-block;margin-top:10px;padding:6px 16px;border:1px solid var(--line);border-radius:99px;color:var(--mint);text-decoration:none;font-size:.9rem;background:var(--glass)}
.tt:hover,.tt:focus-visible{background:rgba(53,232,196,.14);outline:2px solid var(--mint);outline-offset:2px}

.bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--mint2),var(--mint));box-shadow:0 0 14px var(--mint);transition:width 1s}
label,.lbl{display:block;font-size:.95rem;color:var(--mute);margin-bottom:10px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.chip{font:inherit;font-size:1.1rem;padding:12px 0;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);cursor:pointer;transition:.2s}
.chip[aria-pressed=true]{background:linear-gradient(160deg,var(--mint),var(--mint2));color:#02201c;border-color:transparent;font-weight:600;box-shadow:0 0 18px rgba(53,232,196,.4)}

.field span{color:var(--mute)}
textarea{width:100%;font:inherit;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:none;outline:0;height:96px}
::placeholder{color:#5f8982}
.go{width:100%;margin-top:18px;font:inherit;font-size:1.15rem;font-weight:500;letter-spacing:.04em;padding:15px;border:0;border-radius:16px;color:#02201c;background:linear-gradient(120deg,var(--mint),#7bf5dc 55%,var(--mint2));cursor:pointer;box-shadow:0 8px 30px rgba(53,232,196,.35);transition:transform .15s,opacity .2s}

.acc{text-align:center}.acc .n{font-size:1.75rem;font-weight:500;letter-spacing:.06em;margin:4px 0 14px;color:var(--ink)}
.copy{font:inherit;padding:10px 24px;border-radius:12px;border:1px solid var(--mint);background:rgba(53,232,196,.1);color:var(--mint);cursor:pointer}
.copy:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.qr.crop img{width:100%;height:auto;aspect-ratio:830/285;object-fit:cover;object-position:top}.qr canvas{display:block;width:100%;height:auto;background:#fff;padding:0 8%}.qr.crop+.cap{display:block}.cap{margin:12px 0 0;text-align:center;color:var(--mute);font-size:.9rem}.cap[hidden]{display:none}
.back{display:block;margin:20px auto 0;font:inherit;color:var(--mute);background:none;border:0;cursor:pointer;padding:8px 14px}

.burger{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0}
.burger i{display:block;width:22px;height:2px;border-radius:2px;background:var(--mint);transition:transform .25s,opacity .25s}
.burger:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.ov{position:fixed;inset:0;z-index:30;background:rgba(1,10,9,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px}

.dlg h2{margin:0 0 4px;font-size:1.25rem;font-weight:500}
.dlg .sub{margin:0 0 16px;color:var(--mute);font-weight:300;font-size:.9rem}
.dlg input[type=text],.dlg input[type=password],.dlg input[type=number]{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;margin-bottom:12px}
.dlg input:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(53,232,196,.2)}
.dlg input[type=range]{width:100%;accent-color:var(--mint);margin:0 0 14px}
.dlg .row{display:flex;gap:10px;margin-top:6px}
.dlg .row button{flex:1;font:inherit;padding:12px;border-radius:14px;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink)}
.dlg .row button.pri{border:0;color:#02201c;font-weight:500;background:linear-gradient(120deg,var(--mint),#7bf5dc 55%,var(--mint2))}
.dlg .row button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.dlg .err{min-height:1.3em;margin:4px 0 0;font-size:.85rem;color:#ffb4a8}
.dlg .ok{min-height:1.3em;margin:8px 0 0;font-size:.85rem;color:var(--mint)}
.dlg .gv{display:flex;justify-content:space-between;color:var(--mute);font-size:.95rem;margin-bottom:6px}.dlg .gv b{color:var(--mint);font-weight:500}
.dlg .div{height:1px;background:var(--line);margin:16px 0}

.inb-h b{font-weight:500}.inb-h span{color:var(--mint);font-size:.85rem}

.msg-i{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.04)}
.msg-i .t{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--mute)}
.msg-i .a{color:var(--mint);font-weight:500;font-size:.95rem}
.msg-i .b{margin:6px 0 0;word-break:break-word;white-space:pre-wrap;font-weight:300}
.msg-i .b.e{color:var(--mute);font-style:italic}
.msg-i button{font:inherit;font-size:.78rem;color:#ffb4a8;background:none;border:0;cursor:pointer;padding:0}
